<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Por encomenda | Vinii Imports</title><style>
*{box-sizing:border-box}body{margin:0;background:#101114;color:#f5f3ee;font:16px system-ui,sans-serif}main,header{max-width:1100px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #373737}a{color:#e0bd62}h1{font-size:clamp(32px,6vw,54px);margin-bottom:10px}p{color:#c3c4c9;line-height:1.5}.filters{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}input,select,button{font:inherit;padding:12px;border-radius:8px;border:1px solid #565656;background:#202127;color:#fff}button{background:#d7b64e;color:#101114;font-weight:700;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.item{padding:22px;border:1px solid #373737;background:#191a1f;border-radius:14px;display:flex;flex-direction:column;gap:12px}.item h2{font-size:20px;margin:0}.item strong{font-size:25px;color:#e0bd62}.item small{color:#c3c4c9}.item p{margin:0}.item button{margin-top:auto}dialog{background:#191a1f;color:#fff;border:1px solid #555;border-radius:15px;width:min(92%,440px);padding:24px}dialog::backdrop{background:#000b}form{display:grid;gap:12px}label{display:grid;gap:5px}.muted{background:transparent;color:#fff}#result{color:#e0bd62}#search{flex:1;min-width:180px}#model,#category{max-width:100%;min-width:0}@media(max-width:600px){.filters select,.filters input{width:100%;flex:1 1 100%}.filters button{width:100%}}
</style></head><body><header><strong>VINII IMPORTS</strong><a href="../">Voltar à loja</a></header><main><h1>Por encomenda</h1><p>Escolha seu produto e solicite atendimento. Disponibilidade e prazo sujeitos à confirmação da loja.</p><div class="filters"><input id="search" placeholder="Buscar produto" aria-label="Buscar produto"><select id="category" aria-label="Categoria"><option value="">Todas as categorias</option></select><select id="model" aria-label="Modelo"><option value="">Todos os modelos</option></select><button id="reload">Atualizar</button></div><p id="status" role="status"></p><div class="grid" id="catalog"></div></main><dialog id="modal"><form id="order"><h2 id="name"></h2><p id="price"></p><label>Seu nome<input name="leadName" required minlength="2" maxlength="80" autocomplete="name"></label><label>WhatsApp com DDD<input name="leadWhatsApp" required type="tel" autocomplete="tel"></label><label>Cor desejada (opcional)<input name="cor" maxlength="100"></label><button type="submit" id="send">Registrar solicitação</button><button type="button" class="muted" id="close">Fechar</button><p id="result" role="status"></p><a id="wa" hidden target="_blank" rel="noopener">Continuar no WhatsApp</a></form></dialog><script>
const API='https://script.google.com/macros/s/AKfycbyIV3LtwemLEtg1EifTsBP8MA54ngWIBoJBkhXOduwptp10W1xi6jJEu9pBKV1bYObM/exec';const $=id=>document.getElementById(id),money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let items=[],chosen=null;
const modelCollator=new Intl.Collator('pt-BR',{numeric:true,sensitivity:'base'});
function modelKey(i){
 const name=String(i.nome||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const cat=String(i.categoria||'').toLowerCase();
 const m=name.match(/\biphone\s*(\d{1,2})(?!\d)/)||(/iphone/.test(cat)?name.match(/^\s*(\d{1,2})(?!\d)/):null);
 if(!m)return null;
 const tail=name.slice(m.index+m[0].length);
 const version=/^\s*pro\s*max\b/.test(tail)?6:/^\s*pro\b/.test(tail)?5:/^\s*plus\b/.test(tail)?4:/^\s*air\b/.test(tail)?3:/^\s*mini\b/.test(tail)?1:/^\s*e\b/.test(tail)?0:2;
 const storage=tail.match(/\b(\d+)\s*(tb|gb)\b/i)||tail.match(/\b(64|128|256|512|1024|2048)\b/);
 return [Number(m[1]),version,storage?Number(storage[1])*(storage[2]==='tb'?1024:1):0];
}
function compareModels(a,b){
 const x=modelKey(a),y=modelKey(b);
 if(x&&y)return x[0]-y[0]||x[1]-y[1]||x[2]-y[2]||modelCollator.compare(String(a.nome||''),String(b.nome||''));
 if(x||y)return x?-1:1;
 return modelCollator.compare(String(a.categoria||''),String(b.categoria||''))||modelCollator.compare(String(a.nome||''),String(b.nome||''));
}
function modelLabel(i){
 const k=modelKey(i);
 if(k)return 'iPhone '+k[0]+(['e',' Mini','',' Air',' Plus',' Pro',' Pro Max'][k[1]]);
 const n=String(i.nome||'').trim();
 const special=n.match(/\biphone\s*(xr|xs\s*max|xs|x|se)\b/i);
 if(special)return 'iPhone '+special[1].toUpperCase();
 return n||'Outros';
}
const genericHeartColors={'🖤':'Preto','🤍':'Branco','🩶':'Cinza','💙':'Azul','🩵':'Azul-claro','💚':'Verde','💛':'Amarelo','🧡':'Laranja','💜':'Roxo','🩷':'Rosa','💗':'Rosa','💖':'Rosa','💕':'Rosa','❤️':'Vermelho','❤':'Vermelho','🤎':'Marrom'};
function displayColors(i){
 const raw=String(i.cores||'').trim();
 if(!raw)return '';
 const k=modelKey(i),g=k&&k[0],pro=k&&k[1]>=5;
 let palette=null;
 if(g===17&&pro)palette={'🧡':'Laranja-cósmico','💙':'Azul-intenso','🤍':'Prateado','🩶':'Prateado'};
 else if(g===17&&k[1]===2)palette={'🖤':'Preto','🤍':'Branco','💙':'Azul-névoa','🩵':'Azul-névoa','💚':'Sálvia','💜':'Lavanda'};
 else if(g===16&&pro)palette={'🖤':'Titânio preto','🤍':'Titânio branco','🩶':'Titânio natural','💛':'Titânio-deserto','🤎':'Titânio-deserto'};
 else if(g===15&&pro)palette={'🖤':'Titânio preto','🤍':'Titânio branco','🩶':'Titânio natural','💙':'Titânio azul'};
 else if(g===14&&pro)palette={'🖤':'Preto-espacial','🤍':'Prateado','🩶':'Prateado','💛':'Dourado','💜':'Roxo-profundo'};
 else if(g===13&&pro)palette={'🖤':'Grafite','🩶':'Grafite','🤍':'Prateado','💛':'Dourado','💙':'Azul-Sierra','🩵':'Azul-Sierra','💚':'Verde-alpino'};
 else if(g===12&&pro)palette={'🖤':'Grafite','🩶':'Grafite','🤍':'Prateado','💛':'Dourado','💙':'Azul-Pacífico'};
 else if(g===11&&pro)palette={'🖤':'Cinza-espacial','🩶':'Cinza-espacial','🤍':'Prateado','💛':'Dourado','💚':'Verde-meia-noite'};
 else if(g===16&&k[1]===0)palette={'🖤':'Preto','🤍':'Branco'};
 else if(g===16)palette={'🖤':'Preto','🤍':'Branco','🩷':'Rosa','💗':'Rosa','💖':'Rosa','💕':'Rosa','💚':'Verde-acinzentado','💙':'Ultramarino'};
 else if(g===15)palette={'🖤':'Preto','💙':'Azul','🩵':'Azul','💚':'Verde','💛':'Amarelo','🩷':'Rosa','💗':'Rosa','💖':'Rosa','💕':'Rosa'};
 else if(g===14)palette={'🖤':'Meia-noite','🤍':'Estelar','💙':'Azul','💜':'Roxo','💛':'Amarelo','❤️':'(PRODUCT)RED','❤':'(PRODUCT)RED'};
 else if(g===13)palette={'🖤':'Meia-noite','🤍':'Estelar','💙':'Azul','💚':'Verde','🩷':'Rosa','💗':'Rosa','❤️':'(PRODUCT)RED','❤':'(PRODUCT)RED'};
 else if(g===12||g===11)palette=Object.assign({},genericHeartColors,{'❤️':'(PRODUCT)RED','❤':'(PRODUCT)RED'});
 const tokens=raw.match(/❤️|[❤🖤🤍🩶💙🩵💚💛🧡💜🩷💗💖💕🤎]/gu)||[];
 if(!tokens.length)return raw;
 const names=tokens.map(h=>palette?(palette[h]||genericHeartColors[h]+' (a confirmar)'):genericHeartColors[h]);
 const rest=raw.replace(/❤️|[❤🖤🤍🩶💙🩵💚💛🧡💜🩷💗💖💕🤎]\uFE0F?/gu,' ').replace(/^[\s,;|/]+|[\s,;|/]+$/g,'').trim();
 return [...new Set([...(rest?[rest]:[]),...names])].join(', ');
}
function batteryLabel(i){
 const details=String(i.detalhes||'');
 const m=details.match(/\bbateria\s*:?\s*(\d{1,3})\s*%/i);
 const value=m?Number(m[1]):null;
 if(value!==null&&value>=1&&value<=100)return 'Saúde da bateria: '+value+'%';
 if((modelKey(i)||/iphone/i.test(String(i.nome)+' '+String(i.categoria)))&&!/lacrado|novo de fabrica/i.test(details+' '+i.categoria))return 'Saúde da bateria: consulte';
 return '';
}
function refreshModels(){
 const select=$('model'),previous=select.value,cat=$('category').value;
 const labels=[...new Set(items.filter(i=>!cat||i.categoria===cat).map(modelLabel))];
 select.replaceChildren(new Option('Todos os modelos',''));
 for(const label of labels)select.add(new Option(label,label));
 if(labels.includes(previous))select.value=previous;
}
function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n}function render(){const q=$('search').value.toLocaleLowerCase('pt-BR'),cat=$('category').value,model=$('model').value;const rows=items.filter(i=>(!cat||i.categoria===cat)&&(!model||modelLabel(i)===model)&&[i.nome,displayColors(i),i.cores,i.categoria].join(' ').toLocaleLowerCase('pt-BR').includes(q));$('catalog').replaceChildren();$('status').textContent=rows.length?rows.length+' produto(s)':'Nenhum produto disponível nesta seleção.';for(const i of rows){const c=el('article','');c.className='item';const b=el('button','Solicitar encomenda');b.onclick=()=>{chosen=i;$('order').reset();$('name').textContent=i.nome;$('price').textContent=money(i.preco);$('result').textContent='';$('wa').hidden=true;$('send').disabled=false;$('modal').showModal()};c.append(el('small',i.categoria),el('h2',i.nome),el('p',displayColors(i)?'Cores: '+displayColors(i):'Consulte as cores'),...(batteryLabel(i)?[el('p',batteryLabel(i))]:[]),el('strong',money(i.preco)),b);$('catalog').append(c)}}async function load(){try{$('status').textContent='Carregando catálogo…';const r=await fetch(API+'?action=getEncomendas',{cache:'no-store'});const d=await r.json();if(!r.ok||!Array.isArray(d))throw Error('Catálogo temporariamente indisponível.');items=d.slice().sort(compareModels);const previous=$('category').value;$('category').replaceChildren(new Option('Todas as categorias',''));for(const c of [...new Set(items.map(i=>i.categoria))].sort())$('category').add(new Option(c,c));if([...$('category').options].some(o=>o.value===previous))$('category').value=previous;refreshModels();render()}catch(e){items=[];$('catalog').replaceChildren();$('status').textContent=e.message}}$('search').oninput=render;$('category').onchange=()=>{refreshModels();render()};$('model').onchange=render;$('reload').onclick=load;$('close').onclick=()=>$('modal').close();$('order').onsubmit=async e=>{e.preventDefault();if(!chosen)return;const fields=Object.fromEntries(new FormData(e.target));$('send').disabled=true;$('result').textContent='Registrando…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'encRequest',id:chosen.id,preco:chosen.preco,...fields})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Não foi possível registrar.');$('result').textContent='Solicitação registrada! Continue o atendimento pelo WhatsApp.';$('wa').href='https://wa.me/5522999426581?text='+encodeURIComponent('Olá! Solicitei uma encomenda: '+d.nome+' — '+money(d.preco)+'\nReferência: '+d.id+'\nCor: '+(fields.cor||'A confirmar'));$('wa').hidden=false;}catch(err){$('result').textContent=err.message;$('send').disabled=false}};load();
</script></body></html>
