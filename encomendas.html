./">Voltar à loja</a></header><main><h1>Por encomenda</h1><p>Escolha seu produto e solicite atendimento. Disponibilidade e prazo sujeitos à confirmação da loja.</p><nav id="categoryStrip" class="category-strip" aria-label="Categorias de produtos"></nav><div class="filters"><input id="search" placeholder="Buscar produto" aria-label="Buscar produto"><select id="category" aria-label="Categoria"><option value="">Todas as categorias</option></select><select id="model" aria-label="Modelo"><option value="">Todos os modelos</option></select><button id="reload">Atualizar</button></div><p id="freshness" aria-live="polite" style="font-size:12px;margin:0;color:#a8a9b0"></p><p id="status" role="status"></p><div class="grid" id="catalog"></div></main><dialog id="modal"><form id="order"><h2 id="name"></h2><p id="price"></p><label>Seu nome<input name="leadName" required minlength="2" maxlength="80" autocomplete="name"></label><label>WhatsApp com DDD<input name="leadWhatsApp" required type="tel" autocomplete="tel"></label><label>Cor desejada (opcional)<input name="cor" maxlength="100"></label><button type="submit" id="send">Registrar solicitação</button><button type="button" class="muted" id="close">Fechar</button><p id="result" role="status"></p><a id="wa" hidden target="_blank" rel="noopener">Continuar no WhatsApp</a></form></dialog><script>
const API='https://script.google.com/macros/s/AKfycbyIV3LtwemLEtg1EifTsBP8MA54ngWIBoJBkhXOduwptp10W1xi6jJEu9pBKV1bYObM/exec';const $=id=>document.getElementById(id),money=n=>Number(n).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});let items=[],chosen=null;
const modelCollator=new Intl.Collator('pt-BR',{numeric:true,sensitivity:'base'});
function modelKey(i){
 const name=String(i.nome||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
 const cat=String(i.categoria||'').toLowerCase();
 const m=name.match(/\biphone\s*(\d{1,2})(?!\d)/)||(/iphone/.test(cat)?name.match(/^\s*(\d{1,2})(?!\d)/):null);
 if(!m)return null;
 const tail=name.slice(m.index+m[0].length);
 const version=/^\s*pro\s*max\b/.test(tail)?6:/^\s*pro\b/.test(tail)?5:/^\s*plus\b/.test(tail)?4:/^\s*air\b/.test(tail)?3:/^\s*mini\b/.test(tail)?1:/^\s*e\b/.test(tail)?0:2;
 const storage=tail.match(/\b(\d+)\s*(tb|gb)\b/i)||tail.match(/\b(64|128|256|512|1024|2048)\b/);
 return [Number(m[1]),version,storage?Number(storage[1])*(storage[2]==='tb'?1024:1):0];
}
function compareModels(a,b){
 const x=modelKey(a),y=modelKey(b);
 if(x&&y)return x[0]-y[0]||x[1]-y[1]||x[2]-y[2]||modelCollator.compare(String(a.nome||''),String(b.nome||''));
 if(x||y)return x?-1:1;
 return modelCollator.compare(String(a.categoria||''),String(b.categoria||''))||modelCollator.compare(String(a.nome||''),String(b.nome||''));
}
function modelLabel(i){
 const k=modelKey(i);
 if(k)return 'iPhone '+k[0]+(['e',' Mini','',' Air',' Plus',' Pro',' Pro Max'][k[1]]);
 const n=String(i.nome||'').trim();
 const special=n.match(/\biphone\s*(xr|xs\s*max|xs|x|se)\b/i);
 if(special)return 'iPhone '+special[1].toUpperCase();
 return n||'Outros';
}
const genericHeartColors={'🖤':'Preto','🤍':'Branco','🩶':'Cinza','💙':'Azul','🩵':'Azul-claro','💚':'Verde','💛':'Amarelo','🧡':'Laranja','💜':'Roxo','🩷':'Rosa','💗':'Rosa','💖':'Rosa','💕':'Rosa','❤️':'Vermelho','❤':'Vermelho','🤎':'Marrom'};
function displayColors(i){
 const raw=String(i.cores||'').trim();
 if(!raw)return '';
 const k=modelKey(i),g=k&&k[0],pro=k&&k[1]>=5;
 let palette=null;
 if(g===17&&pro)palette={'🧡':'Laranja-cósmico','💙':'Azul-intenso','🤍':'Prateado','🩶':'Prateado'};
 else if(g===17&&k[1]===2)palette={'🖤':'Preto','🤍':'Branco','💙':'Azul-névoa','🩵':'Azul-névoa','💚':'Sálvia','💜':'Lavanda'};
 else if(g===16&&pro)palette={'🖤':'Titânio preto','🤍':'Titânio branco','🩶':'Titânio natural','💛':'Titânio-deserto','🤎':'Titânio-deserto'};
 else if(g===15&&pro)palette={'🖤':'Titânio preto','🤍':'Titânio branco','🩶':'Titânio natural','💙':'Titânio azul'};
 else if(g===14&&pro)palette={'🖤':'Preto-espacial','🤍':'Prateado','🩶':'Prateado','💛':'Dourado','💜':'Roxo-profundo'};
 else if(g===13&&pro)palette={'🖤':'Grafite','🩶':'Grafite','🤍':'Prateado','💛':'Dourado','💙':'Azul-Sierra','🩵':'Azul-Sierra','💚':'Verde-alpino'};
 else if(g===12&&pro)palette={'🖤':'Grafite','🩶':'Grafite','🤍':'Prateado','💛':'Dourado','💙':'Azul-Pacífico'};
 else if(g===11&&pro)palette={'🖤':'Cinza-espacial','🩶':'Cinza-espacial','🤍':'Prateado','💛':'Dourado','💚':'Verde-meia-noite'};
 else if(g===16&&k[1]===0)palette={'🖤':'Preto','🤍':'Branco'};
 else if(g===16)palette={'🖤':'Preto','🤍':'Branco','🩷':'Rosa','💗':'Rosa','💖':'Rosa','💕':'Rosa','💚':'Verde-acinzentado','💙':'Ultramarino'};
 else if(g===15)palette={'🖤':'Preto','💙':'Azul','🩵':'Azul','💚':'Verde','💛':'Amarelo','🩷':'Rosa','💗':'Rosa','💖':'Rosa','💕':'Rosa'};
 else if(g===14)palette={'🖤':'Meia-noite','🤍':'Estelar','💙':'Azul','💜':'Roxo','💛':'Amarelo','❤️':'(PRODUCT)RED','❤':'(PRODUCT)RED'};
 else if(g===13)palette={'🖤':'Meia-noite','🤍':'Estelar','💙':'Azul','💚':'Verde','🩷':'Rosa','💗':'Rosa','❤️':'(PRODUCT)RED','❤':'(PRODUCT)RED'};
 else if(g===12||g===11)palette=Object.assign({},genericHeartColors,{'❤️':'(PRODUCT)RED','❤':'(PRODUCT)RED'});
 const tokens=raw.match(/❤️|[❤🖤🤍🩶💙🩵💚💛🧡💜🩷💗💖💕🤎]/gu)||[];
 if(!tokens.length)return raw;
 const names=tokens.map(h=>palette?(palette[h]||genericHeartColors[h]+' (a confirmar)'):genericHeartColors[h]);
 const rest=raw.replace(/❤️|[❤🖤🤍🩶💙🩵💚💛🧡💜🩷💗💖💕🤎]\uFE0F?/gu,' ').replace(/^[\s,;|/]+|[\s,;|/]+$/g,'').trim();
 return [...new Set([...(rest?[rest]:[]),...names])].join(', ');
}
function batteryLabel(i){
 const details=String(i.detalhes||'');
 const m=details.match(/\bbateria\s*:?\s*(\d{1,3})\s*%/i);
 const value=m?Number(m[1]):null;
 if(value!==null&&value>=1&&value<=100)return 'Saúde da bateria: '+value+'%';
 if((modelKey(i)||/iphone/i.test(String(i.nome)+' '+String(i.categoria)))&&!/lacrado|novo de fabrica/i.test(details+' '+i.categoria))return 'Saúde da bateria: consulte';
 return '';
}
const categoryArt={"phone":"<rect x=\"19\" y=\"7\" width=\"30\" height=\"50\" rx=\"6\"/><rect x=\"8\" y=\"13\" width=\"24\" height=\"44\" rx=\"5\" fill=\"#29251c\"/><path d=\"M15 21h3m4 0h3m-10 5h3m7 23h2\"/>","watch":"<path d=\"M25 19V6h14v13m-14 26v13h14V45\"/><rect x=\"17\" y=\"17\" width=\"30\" height=\"30\" rx=\"9\" fill=\"#29251c\"/><path d=\"M32 24v9l6 4\"/>","head":"<path d=\"M13 36V28a19 19 0 0 1 38 0v8\"/><rect x=\"10\" y=\"30\" width=\"12\" height=\"20\" rx=\"5\"/><rect x=\"42\" y=\"30\" width=\"12\" height=\"20\" rx=\"5\"/>","tv":"<rect x=\"7\" y=\"13\" width=\"50\" height=\"34\" rx=\"4\"/><path d=\"M32 47v8m-13 0h26\"/><path d=\"m13 39 13-16 9 10 9-12 7 18Z\" fill=\"#6b5529\"/>","perfume":"<rect x=\"15\" y=\"25\" width=\"34\" height=\"32\" rx=\"6\"/><path d=\"M25 25V12h14v13M22 12h20V6H22Z\"/><rect x=\"22\" y=\"34\" width=\"20\" height=\"13\" rx=\"2\"/>","sound":"<rect x=\"19\" y=\"5\" width=\"26\" height=\"54\" rx=\"6\"/><circle cx=\"32\" cy=\"20\" r=\"6\"/><circle cx=\"32\" cy=\"42\" r=\"10\"/>","laptop":"<rect x=\"12\" y=\"10\" width=\"40\" height=\"34\" rx=\"3\"/><path d=\"m12 44-8 9h56l-8-9M26 49h12\"/>","all":"<rect x=\"10\" y=\"10\" width=\"19\" height=\"19\" rx=\"4\"/><rect x=\"35\" y=\"10\" width=\"19\" height=\"19\" rx=\"4\"/><rect x=\"10\" y=\"35\" width=\"19\" height=\"19\" rx=\"4\"/><rect x=\"35\" y=\"35\" width=\"19\" height=\"19\" rx=\"4\"/>","other":"<path d=\"m32 8 24 13v24L32 58 8 45V21Zm0 26L8 21m24 13 24-13M32 34v24M20 14l24 13\"/>"};
function categoryKind(c){const n=c.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();if(!n)return 'all';if(/watch|relogio/.test(n))return 'watch';if(/acessor|fone|capinha/.test(n))return 'head';if(/perfume/.test(n))return 'perfume';if(/caixa.*som|audio|speaker/.test(n))return 'sound';if(/tv|televis/.test(n))return 'tv';if(/macbook|notebook|computador/.test(n))return 'laptop';if(/iphone|samsung|motorola|celular|xiaomi|smartphone/.test(n))return 'phone';return 'other'}
function syncCategoryStrip(){for(const b of $('categoryStrip').children)b.setAttribute('aria-pressed',String(b.dataset.category===$('category').value))}
function renderCategoryStrip(){const strip=$('categoryStrip'),scroll=strip.scrollLeft;strip.replaceChildren();const opts=[...$('category').options];const rank=c=>{if(!c)return -1;const k=categoryKind(c);return ['phone','watch','head','laptop','tv','perfume','sound','other'].indexOf(k)};opts.sort((a,b)=>rank(a.value)-rank(b.value));for(const opt of opts){const b=el('button','');b.type='button';b.className='category-tile';b.dataset.category=opt.value;const art=el('span','');art.className='category-art';art.innerHTML='<svg viewBox="0 0 64 64" fill="#17181d" stroke="#e0bd62" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">'+categoryArt[categoryKind(opt.value)]+'</svg>';b.append(art,el('span',opt.value?opt.text:'Todos'));b.onclick=()=>{$('category').value=opt.value;syncCategoryStrip();refreshModels();render()};strip.append(b)}syncCategoryStrip();strip.scrollLeft=scroll}
function refreshModels(){
 const select=$('model'),previous=select.value,cat=$('category').value;
 const labels=[...new Set(items.filter(i=>!cat||i.categoria===cat).map(modelLabel))];
 select.replaceChildren(new Option('Todos os modelos',''));
 for(const label of labels)select.add(new Option(label,label));
 if(labels.includes(previous))select.value=previous;
}
function productPhotos(i){const urls=Array.isArray(i.fotos)?i.fotos.filter(u=>typeof u==='string'&&/^https:\/\//i.test(u)):[];if(!urls.length)return [];let index=0;const wrap=document.createElement('div'),img=document.createElement('img');img.className='product-photo';img.alt=i.nome;img.loading='lazy';img.referrerPolicy='no-referrer';img.src=urls[0];wrap.append(img);img.onerror=()=>{img.hidden=true};if(urls.length>1){const controls=document.createElement('div');controls.className='photo-controls';const prev=el('button','‹'),next=el('button','›'),count=el('small','1 / '+urls.length);function show(n){index=(n+urls.length)%urls.length;img.hidden=false;img.src=urls[index];count.textContent=(index+1)+' / '+urls.length}prev.onclick=()=>show(index-1);next.onclick=()=>show(index+1);controls.append(prev,count,next);wrap.append(controls)}return [wrap]}function el(tag,text){const n=document.createElement(tag);n.textContent=text;return n}function render(){const q=$('search').value.toLocaleLowerCase('pt-BR'),cat=$('category').value,model=$('model').value;const rows=items.filter(i=>(!cat||i.categoria===cat)&&(!model||modelLabel(i)===model)&&[i.nome,displayColors(i),i.cores,i.categoria].join(' ').toLocaleLowerCase('pt-BR').includes(q));$('catalog').replaceChildren();$('status').textContent=rows.length?rows.length+' produto(s)':'Nenhum produto disponível nesta seleção.';for(const i of rows){const c=el('article','');c.className='item';const b=el('button','Solicitar encomenda');b.onclick=()=>{chosen=i;$('order').reset();$('name').textContent=i.nome;$('price').textContent=money(i.preco);$('result').textContent='';$('wa').hidden=true;$('send').disabled=false;$('modal').showModal()};c.append(...productPhotos(i),el('small',i.categoria),el('h2',i.nome),el('p',displayColors(i)?'Cores: '+displayColors(i):'Consulte as cores'),...(batteryLabel(i)?[el('p',batteryLabel(i))]:[]),el('strong',money(i.preco)),b);$('catalog').append(c)}}const CACHE_KEY='vinii_encomendas_public_v1',CACHE_MAX_AGE=24*60*60*1000,REFRESH_MS=60000;
let hasCatalog=false,refreshing=false,lastUpdated=0,lastAttempt=0,updateState='';
function validCatalog(rows){return Array.isArray(rows)&&rows.every(i=>i&&typeof i.id!=='undefined'&&typeof i.nome==='string'&&typeof i.categoria==='string'&&Number.isFinite(Number(i.preco))&&Number(i.preco)>0);}
function publicCacheRows(rows){return rows.map(i=>({id:i.id,nome:i.nome,categoria:i.categoria,preco:i.preco,cores:i.cores,detalhes:i.detalhes,fotos:Array.isArray(i.fotos)?i.fotos:[]}));}
function updateNotice(){const time=lastUpdated?new Date(lastUpdated).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}):'';$('freshness').textContent=updateState+(time?' · Última consulta: '+time:'');}
function applyCatalog(rows){const previous=$('category').value;items=rows.slice().sort(compareModels);hasCatalog=true;$('category').replaceChildren(new Option('Todas as categorias',''));for(const c of [...new Set(items.map(i=>i.categoria))].sort())$('category').add(new Option(c,c));if([...$('category').options].some(o=>o.value===previous))$('category').value=previous;renderCategoryStrip();refreshModels();render();}
function readCatalogCache(){try{const saved=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(saved&&Number.isFinite(saved.time)&&Date.now()-saved.time>=0&&Date.now()-saved.time<CACHE_MAX_AGE&&validCatalog(saved.rows)){lastUpdated=saved.time;applyCatalog(saved.rows);updateState='Catálogo salvo neste dispositivo';updateNotice();}}catch(e){}}
async function load(){if(refreshing)return;refreshing=true;lastAttempt=Date.now();$('reload').disabled=true;updateState=hasCatalog?'Atualizando catálogo…':'Consultando disponibilidade…';updateNotice();if(!hasCatalog)$('status').textContent='Carregando catálogo…';const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),25000);try{const r=await fetch(API+'?action=getEncomendas',{cache:'no-store',signal:controller.signal});const d=await r.json();if(!r.ok||!validCatalog(d))throw Error('Catálogo temporariamente indisponível.');const rows=publicCacheRows(d);const changed=!hasCatalog||JSON.stringify(items)!==JSON.stringify(rows.slice().sort(compareModels));lastUpdated=Date.now();if(changed)applyCatalog(rows);try{localStorage.setItem(CACHE_KEY,JSON.stringify({time:lastUpdated,rows}));}catch(e){}updateState='Catálogo atualizado';if(chosen&&$('modal').open){const current=items.find(i=>String(i.id)===String(chosen.id));if(!current){$('result').textContent='Este produto não está mais disponível. Feche e escolha outro.';$('send').disabled=true;}else if(Number(current.preco)!==Number(chosen.preco)){$('result').textContent='O preço mudou. Feche e selecione o produto novamente.';$('send').disabled=true;}}}catch(e){updateState=hasCatalog?'Sem atualização no momento. Confirme preço e disponibilidade.':'Não foi possível atualizar o catálogo.';if(!hasCatalog)$('status').textContent='Não foi possível carregar. Clique em Atualizar.';}finally{clearTimeout(timer);refreshing=false;$('reload').disabled=false;updateNotice();}}
function refreshIfVisible(){if(!document.hidden&&Date.now()-lastAttempt>=REFRESH_MS)load();}
$('search').oninput=render;$('category').onchange=()=>{syncCategoryStrip();refreshModels();render()};$('model').onchange=render;$('reload').onclick=load;$('close').onclick=()=>$('modal').close();$('order').onsubmit=async e=>{e.preventDefault();if(!chosen)return;const fields=Object.fromEntries(new FormData(e.target));$('send').disabled=true;$('result').textContent='Registrando…';try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'encRequest',id:chosen.id,preco:chosen.preco,...fields})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Não foi possível registrar.');$('result').textContent='Solicitação registrada! Continue o atendimento pelo WhatsApp.';$('wa').href='https://wa.me/5522999426581?text='+encodeURIComponent('Olá! Solicitei uma encomenda: '+d.nome+' — '+money(d.preco)+'\nReferência: '+d.id+'\nCor: '+(fields.cor||'A confirmar'));$('wa').hidden=false;}catch(err){$('result').textContent=err.message;$('send').disabled=false}};readCatalogCache();load();setInterval(refreshIfVisible,REFRESH_MS);document.addEventListener('visibilitychange',refreshIfVisible);window.addEventListener('online',()=>load());
</script></body></html>
