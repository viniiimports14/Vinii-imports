<section id="acc-shop" aria-labelledby="acc-title"><header class="acc-head"><div><small>VINII IMPORTS · LOJA DE ACESSÓRIOS</small><h2 id="acc-title">Acessórios para seu iPhone<span class="acc-head-dot">.</span></h2><p class="acc-head-desc">Escolha sua capinha, película e muito mais. Tudo em um só lugar.</p></div><a class="acc-button secondary acc-back" href="/">← Voltar aos iPhones</a></header><div class="acc-wrap" id="acc-content"></div><div id="acc-live" role="status" aria-live="polite"></div></section>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyIV3LtwemLEtg1EifTsBP8MA54ngWIBoJBkhXOduwptp10W1xi6jJEu9pBKV1bYObM/exec';
const WHATSAPP_NUMBER = '5522999426581';

(()=>{'use strict';
const $=id=>document.getElementById(id),shop=$('acc-shop'),content=$('acc-content'),money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),safeImage=u=>/^https:\/\//i.test(u||'')?esc(u):'',hex=v=>/^#[a-f0-9]{6}$/i.test(v)?v:'#c5a66c';
const storage={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(_){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}}},session={get(k){try{return JSON.parse(sessionStorage.getItem(k))}catch(_){return null}},set(k,v){try{sessionStorage.setItem(k,JSON.stringify(v))}catch(_){}}};
let data={items:[],shipping:[],payment:{}},cart=storage.get('vinii_acc_cart_v1')||{},selected={},view='catalog',draft={},lastOrder=session.get('vinii_acc_last_order'),pending=session.get('vinii_acc_pending'),loading=false,search='',model='',kind='';
let pendingSent=!!pending;
if(!cart||typeof cart!=='object'||Array.isArray(cart))cart={};
function saveCart(){storage.set('vinii_acc_cart_v1',cart)}
function message(t){$('acc-live').textContent=t||''}
async function request(action,body){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),body&&action==='createAccessoryOrder'?18000:45000);try{const r=await fetch(body?API_URL:API_URL+'?action='+action+'&_='+Date.now(),body?{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,action}),signal:controller.signal}:{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error('Conexão indisponível. Tente novamente.');const d=await r.json();if(d.error){const e=Error(d.error==='unknown action'?'A loja de acessórios está sendo preparada. Volte em breve.':d.error);e.definitive=true;throw e}return d}finally{clearTimeout(timer)}}
function productModels(i){return Array.isArray(i.modelos)?i.modelos:String(i.modelo||'').split(/[/;,|\n]+/).map(s=>s.trim()).filter(Boolean)}
const CATALOG_CACHE_KEY='vinii_acc_catalog_v3_groups',CATALOG_CACHE_TTL=24*60*60*1000;
let catalogPromise=null;
function readCatalogCache(){const c=storage.get(CATALOG_CACHE_KEY),age=Date.now()-Number(c?.savedAt);if(!c||c.version!==1||!Number.isFinite(age)||age<0||age>CATALOG_CACHE_TTL||!Array.isArray(c.data?.items)||!Array.isArray(c.data?.shipping))return null;return {ok:true,items:c.data.items,shipping:c.data.shipping,payment:c.data.payment||{}}}
function writeCatalogCache(d){storage.set(CATALOG_CACHE_KEY,{version:1,savedAt:Date.now(),data:{items:d.items,shipping:d.shipping,payment:{whatsapp:d.payment?.whatsapp||WHATSAPP_NUMBER}}})}
function load(){if(catalogPromise)return catalogPromise;catalogPromise=(async()=>{const d=await request('getAccessoryCatalog');if(!d.ok||!Array.isArray(d.items)||!Array.isArray(d.shipping))throw Error('A loja de acessórios está sendo preparada.');data=d;writeCatalogCache(d);return d})().finally(()=>{catalogPromise=null});return catalogPromise}
function refreshCatalogView(){if(pending||loading||!['catalog','cart'].includes(view))return;const active=document.activeElement,id=active?.id,start=active?.selectionStart,end=active?.selectionEnd;render();if(id==='acc-search'){const input=$('acc-search');if(input){input.focus({preventScroll:true});if(Number.isInteger(start)&&Number.isInteger(end))input.setSelectionRange(start,end)}}}
function count(){return Object.values(cart).reduce((s,q)=>s+(Number(q)||0),0)}
function lines(){return Object.entries(cart).map(([key,q])=>({item:data.items.find(i=>i.key===key),key,q:Number(q)}))}
function cartProblems(){return lines().some(l=>!l.item||l.q<1||l.q>l.item.quantidade||l.q>100)}
function subtotal(){return lines().reduce((s,l)=>s+(l.item?Math.round(l.item.preco*100)*l.q:0),0)/100}
function toolbar(){return `<div class="acc-actions"><button class="acc-button secondary" data-view="catalog">← Ver acessórios</button><button class="acc-button" data-view="cart">Carrinho · ${count()}</button>${lastOrder?'<button class="acc-button secondary" data-view="success">Último pedido</button>':''}</div>`}
function render(){message('');if(pending){renderRecovery();return}if(view==='catalog')renderCatalog();else if(view==='cart')renderCart();else if(view==='checkout')renderCheckout();else renderSuccess();bindCommon()}
function renderCatalog(){
 const groups=new Map();for(const i of data.items){const key=i.tipo==='Capinha'?'Capinha|'+(productModels(i).slice().sort().join(' / ')||'Sem modelo informado'):i.key;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(i)}
 content.innerHTML=`<p class="acc-muted">Capinhas, películas, carregadores, Air Pods e Smart Watch para comprar separadamente. Escolha seus favoritos e monte o carrinho.</p><div class="acc-top"><input class="acc-input" id="acc-search" type="search" placeholder="Buscar modelo, acessório ou cor" aria-label="Buscar acessórios" value="${esc(search)}"><select class="acc-input" id="acc-kind" aria-label="Tipo de acessório"><option value="">Todos os acessórios</option>${['Capinha','Película','Carregador','Air Pods','Smart Watch'].map(t=>`<option ${kind===t?'selected':''}>${t}</option>`).join('')}</select><select class="acc-input" id="acc-model" aria-label="Filtrar por modelo"><option value="">Todos os modelos</option>${[...new Set(data.items.flatMap(productModels).filter(Boolean))].sort().map(m=>`<option ${model===m?'selected':''}>${esc(m)}</option>`).join('')}</select><button class="acc-button" data-view="cart">Carrinho · ${count()}</button></div><div class="acc-grid" id="acc-products"></div>${!data.shipping.length?'<p class="acc-muted">As regiões de entrega ainda estão sendo cadastradas.</p>':''}${lastOrder?'<div class="acc-actions"><button class="acc-button secondary" data-view="success">Ver último pedido</button></div>':''}`;
 function cards(){const term=search.toLocaleLowerCase('pt-BR');$('acc-products').innerHTML=[...groups.entries()].filter(([k,items])=>items.some(i=>(!kind||i.tipo===kind)&&(!model||productModels(i).includes(model))&&`${i.nome} ${i.modelo} ${i.tipo}`.toLocaleLowerCase('pt-BR').includes(term))).map(([group,items])=>{
 const i=items.find(i=>i.key===selected[group])||items.find(i=>i.nome.toLocaleLowerCase('pt-BR').includes(term))||items[0];selected[group]=i.key;
 return `<article class="acc-card"><button type="button" class="acc-product-photo" ${i.foto?`data-photo="${safeImage(i.foto)}" aria-label="Ampliar foto de ${esc(i.nome)}"`:'disabled aria-label="Foto ainda não cadastrada"'}>${i.foto?`<img src="${safeImage(i.foto)}" alt="${esc(i.tipo+' '+i.modelo+' '+i.nome)}" loading="lazy"><span class="acc-photo-hint">Ampliar ↗</span>`:`<span class="acc-placeholder">${esc(i.tipo)}<br>${esc(i.modelo)}<br>Foto em breve</span>`}</button><div class="acc-card-body"><span class="acc-tag">${esc(i.tipo)}</span><h3>${esc(i.tipo==='Capinha'?i.modelo||'Capinha':i.nome)}</h3>${i.tipo==='Capinha'?`<div class="acc-swatches" role="group" aria-label="Cores disponíveis">${items.map(c=>`<button type="button" class="acc-swatch" style="background:${hex(c.hex)}" data-color="${esc(c.key)}" data-group="${esc(group)}" title="${esc(c.nome)}" aria-label="Cor ${esc(c.nome)}" aria-pressed="${c.key===i.key}"></button>`).join('')}</div><div class="acc-muted">Cor: <b>${esc(i.nome)}</b></div>`:`<div class="acc-muted">${esc(i.modelo||'Confira a compatibilidade com o atendente')}</div>`}<div class="acc-price">${money(i.preco)}</div><div class="acc-muted">${i.quantidade}${i.quantidade===1?' disponível':' disponíveis'}</div><button type="button" class="acc-button" style="margin-top:12px" data-add="${esc(i.key)}">Adicionar ao carrinho</button></div></article>`}).join('')||'<div class="acc-empty" style="grid-column:1/-1">Nenhum acessório disponível para esta busca.</div>';bindCommon();content.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{selected[b.dataset.group]=b.dataset.color;cards()})}
 cards();$('acc-search').oninput=e=>{search=e.target.value;cards()};$('acc-kind').onchange=e=>{kind=e.target.value;cards()};$('acc-model').onchange=e=>{model=e.target.value;cards()};
}
function bindCommon(){content.querySelectorAll('[data-view]').forEach(b=>b.onclick=async()=>{if(b.dataset.view==='checkout'){await toCheckout();return}view=b.dataset.view;render()});content.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const i=data.items.find(i=>i.key===b.dataset.add),q=Number(cart[i.key]||0);if(q>=Math.min(i.quantidade,100)){message('Você já adicionou a quantidade disponível dessa opção.');return}cart[i.key]=q+1;saveCart();render();message(i.tipo+' '+i.nome+' adicionado ao carrinho.')});content.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>{$('acc-photo-img').src=b.dataset.photo;$('acc-photo').showModal()})}
function renderCart(){content.innerHTML=toolbar()+`<h3>Seu carrinho</h3>${!count()?'<div class="acc-empty">Seu carrinho está vazio. Escolha um acessório para começar.</div>':lines().map(l=>`<article class="acc-cart-item"><div>${l.item?.foto?`<img src="${safeImage(l.item.foto)}" alt="${esc(l.item.nome)}">`:'◈'}</div><div><strong>${esc(l.item?l.item.tipo+' '+l.item.modelo+' · '+l.item.nome:'Acessório indisponível')}</strong><div class="acc-muted">${l.item?money(l.item.preco)+' por unidade':'Remova este item para continuar.'}</div><div class="acc-qty"><button type="button" data-qty="${esc(l.key)}" data-delta="-1" aria-label="Diminuir quantidade">−</button><span>${l.q}</span><button type="button" data-qty="${esc(l.key)}" data-delta="1" aria-label="Aumentar quantidade">+</button><button type="button" class="acc-remove" data-remove="${esc(l.key)}">Remover</button></div>${l.item&&l.q>l.item.quantidade?'<p class="acc-message">Estoque mudou. Diminua a quantidade.</p>':''}</div><strong>${l.item?money(l.item.preco*l.q):'—'}</strong></article>`).join('')+`<div class="acc-total-row"><span>Subtotal</span><b>${money(subtotal())}</b></div><p class="acc-muted">O frete será calculado pelo seu endereço.</p><button class="acc-button" data-view="checkout" ${cartProblems()?'disabled':''}>Continuar para entrega</button>`}`;
 content.querySelectorAll('[data-qty]').forEach(b=>b.onclick=()=>{const key=b.dataset.qty,item=data.items.find(i=>i.key===key),q=Number(cart[key])+Number(b.dataset.delta);if(q>Math.min(item?.quantidade||0,100)){message('Quantidade indisponível.');return}if(q<=0)delete cart[key];else cart[key]=q;saveCart();render()});content.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete cart[b.dataset.remove];saveCart();render()})}
async function toCheckout(){message('Conferindo estoque e entrega…');try{await load();if(cartProblems()){view='cart';render();message('O estoque mudou. Confira os itens do carrinho.');return}view='checkout';render()}catch(e){message(e.message)}}
function renderCheckout(){if(!count()){view='cart';renderCart();return}const states=[...new Set(data.shipping.map(f=>f.uf))].sort();
 content.innerHTML=toolbar()+`<h3>Entrega e pagamento</h3><form id="acc-checkout"><div class="acc-columns"><div><div class="acc-fields"><label class="acc-field wide">Nome completo<input name="nome" required minlength="2" maxlength="100" autocomplete="name"></label><label class="acc-field wide">WhatsApp com DDD<input name="whatsapp" type="tel" inputmode="tel" required autocomplete="tel" placeholder="(22) 99999-9999"></label><label class="acc-field">Estado<select name="uf" required><option value="">Selecione</option>${states.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label><label class="acc-field">Cidade<select name="cidade" required><option value="">Selecione o estado</option></select></label><label class="acc-field wide">Bairro<select name="freteId" required><option value="">Selecione a cidade</option></select></label><label class="acc-field wide">Rua / Avenida<input name="rua" required maxlength="150" autocomplete="address-line1"></label><label class="acc-field">Número<input name="numero" required maxlength="20" placeholder="Número ou S/N"></label><label class="acc-field">CEP (opcional)<input name="cep" inputmode="numeric" maxlength="9" autocomplete="postal-code" placeholder="00000-000"></label><label class="acc-field wide">Complemento (opcional)<input name="complemento" maxlength="100" autocomplete="address-line2"></label><label class="acc-field wide">Ponto de referência (opcional)<input name="referencia" maxlength="150"></label></div><p class="acc-muted">Seu bairro não aparece? <a id="acc-contact-region" style="color:#e6c58d" target="_blank" rel="noopener">Fale com um atendente para consultar a entrega.</a></p></div><aside class="acc-summary"><h3 style="margin-top:0">Resumo do pedido</h3>${lines().map(l=>`<p class="acc-muted">${l.q}× ${esc(l.item.tipo+' '+l.item.modelo+' '+l.item.nome)} · ${money(l.q*l.item.preco)}</p>`).join('')}<div class="acc-total-row"><span>Produtos</span><b>${money(subtotal())}</b></div><div class="acc-total-row"><span>Entrega</span><b id="acc-freight">Selecione seu bairro</b></div><div class="acc-total-row total"><span>Total</span><b id="acc-total">—</b></div><p class="acc-muted">Ao finalizar, você receberá a chave Pix e poderá conversar com um atendente pelo WhatsApp. O pagamento será confirmado pela loja.</p><button type="submit" class="acc-button" id="acc-place" style="width:100%">Finalizar pedido</button><p id="acc-checkout-error" class="acc-muted" role="alert"></p></aside></div></form>`;
 const f=$('acc-checkout'),fields=f.elements;$('acc-contact-region').href='https://wa.me/'+String(data.payment.whatsapp||WHATSAPP_NUMBER).replace(/\D/g,'')+'?text='+encodeURIComponent('Olá! Quero comprar acessórios e consultar a entrega para meu bairro.');
 function cities(){fields.cidade.innerHTML='<option value="">Selecione</option>'+[...new Set(data.shipping.filter(s=>s.uf===fields.uf.value).map(s=>s.cidade))].sort().map(c=>`<option>${esc(c)}</option>`).join('');if(draft.cidade&&[...fields.cidade.options].some(o=>o.value===draft.cidade))fields.cidade.value=draft.cidade;neighborhoods()}
 function neighborhoods(){fields.freteId.innerHTML='<option value="">Selecione</option>'+data.shipping.filter(s=>s.uf===fields.uf.value&&s.cidade===fields.cidade.value).map(s=>`<option value="${esc(s.id)}">${esc(s.bairro)}</option>`).join('');if(draft.freteId&&[...fields.freteId.options].some(o=>o.value===draft.freteId))fields.freteId.value=draft.freteId;totals()}
 function totals(){const r=data.shipping.find(s=>s.id===fields.freteId.value);$('acc-freight').textContent=r?money(r.valor):'Selecione seu bairro';$('acc-total').textContent=r?money(subtotal()+r.valor):'—'}
 for(const [k,v] of Object.entries(draft))if(fields[k]&&!['cidade','freteId'].includes(k))fields[k].value=v;cities();fields.uf.onchange=()=>{draft.cidade='';draft.freteId='';cities()};fields.cidade.onchange=()=>{draft.freteId='';neighborhoods()};fields.freteId.onchange=totals;f.oninput=()=>{draft=Object.fromEntries(new FormData(f))};f.onchange=()=>{draft=Object.fromEntries(new FormData(f))};
 f.onsubmit=async e=>{e.preventDefault();draft=Object.fromEntries(new FormData(f));if(!data.shipping.find(s=>s.id===draft.freteId)){message('Selecione uma região de entrega disponível.');return}const payload={requestId:crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)+'-'+Math.random().toString(36).slice(2),nome:draft.nome,whatsapp:draft.whatsapp,freteId:draft.freteId,endereco:{rua:draft.rua,numero:draft.numero,cep:draft.cep,complemento:draft.complemento,referencia:draft.referencia},items:lines().map(l=>({key:l.key,quantidade:l.q}))};pending=payload;pendingSent=false;session.set('vinii_acc_pending',payload);await submitPending()};
}
async function orderProof(payload){
 if(!crypto.subtle)throw Error('Não foi possível conferir a conexão. Fale com o atendente para localizar seu pedido.');
 const text=(v,max)=>String(v==null?'':v).trim().slice(0,max),e=payload.endereco||{},grouped={};
 (payload.items||[]).forEach(i=>{grouped[String(i.key)]=(grouped[String(i.key)]||0)+Number(i.quantidade)});
 const canonical=JSON.stringify({nome:text(payload.nome,100),whatsapp:String(payload.whatsapp||'').replace(/\D/g,''),endereco:{rua:text(e.rua,150),numero:text(e.numero,20),complemento:text(e.complemento,100),referencia:text(e.referencia,150),cep:text(e.cep,10)},freteId:String(payload.freteId),items:Object.keys(grouped).sort().map(k=>[k,grouped[k]])});
 const bytes=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(canonical)));return btoa(Array.from(bytes,b=>String.fromCharCode(b)).join(''));
}
function orderJsonp(params){return new Promise((resolve,reject)=>{
 const callback='viniiOrder_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script');let timer;
 const clean=()=>{clearTimeout(timer);script.remove();delete window[callback]};
 window[callback]=value=>{clean();resolve(value)};script.onerror=()=>{clean();reject(Error('Não foi possível consultar o pedido.'))};
 script.src=API_URL+'?'+new URLSearchParams({...params,callback,_:Date.now()});script.referrerPolicy='no-referrer';
 timer=setTimeout(()=>{clean();reject(Error('A consulta do pedido demorou.'))},8000);document.head.append(script);
})}
async function recoverOrder(payload){return recoverOrderByProof({requestId:payload.requestId,proof:await orderProof(payload)})}
async function recoverOrderByProof(lookup){
 const params={action:'getAccessoryOrder',requestId:lookup.requestId,proof:lookup.proof},url=API_URL+'?'+new URLSearchParams({...params,_:Date.now()});
 let result;const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),4000);
 try{const response=await fetch(url,{cache:'no-store',credentials:'omit',signal:ctrl.signal});if(!response.ok)throw Error('Conexão indisponível.');result=await response.json()}
 catch(_){result=await orderJsonp(params)}finally{clearTimeout(timer)}
 if(result?.error)throw Error(result.error==='unknown action'?'A loja precisa atualizar a confirmação de pedidos. Fale com um atendente.':result.error);
 if(!result?.ok)throw Error('A consulta não foi confirmada.');return result.found&&result.order?result:null;
}
async function sendOrderWithoutReading(payload){
 const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),9000);
 try{await fetch(API_URL,{method:'POST',mode:'no-cors',credentials:'omit',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...payload,action:'createAccessoryOrder'}),signal:controller.signal})}catch(_){}finally{clearTimeout(timer)}
}
function recoveryContact(){
 const p=pending;if(!p)return '';
 const text='Olá! Preciso de ajuda para confirmar meu pedido de acessórios.\nPedido: AC-'+p.requestId+'\nNome: '+p.nome+'\nWhatsApp: '+p.whatsapp+'\nItens: '+(p.items||[]).map(i=>{const product=data.items.find(v=>v.key===i.key);return i.quantidade+'× '+(product?[product.tipo,product.modelo,product.nome].filter(Boolean).join(' '):i.key)}).join(', ')+'\nPor favor, confira no ADM se ele já foi registrado antes de criar outro.';
 return 'https://wa.me/'+String(data.payment.whatsapp||WHATSAPP_NUMBER).replace(/\D/g,'')+'?text='+encodeURIComponent(text);
}
function renderRecovery(){content.innerHTML=`<div class="acc-summary"><h3>${loading?'Confirmando seu pedido…':'Vamos conferir seu pedido'}</h3><p class="acc-muted">Se o pedido já foi registrado, vamos abrir a confirmação sem criar outra compra.</p><div class="acc-actions"><button class="acc-button" id="acc-retry" ${loading?'disabled':''}>${loading?'Conferindo…':'Conferir e continuar'}</button><a class="acc-button secondary" href="${esc(recoveryContact())}" target="_blank" rel="noopener">Conversar com um atendente</a></div><p class="acc-muted">Se a conexão continuar falhando, o atendente pode localizar esta tentativa e ajudar a finalizar.</p></div>`;$('acc-retry').onclick=submitPending}
async function finishConfirmedOrder(result){
 if(pending){try{orderLookup={requestId:pending.requestId,proof:await orderProof(pending)};session.set('vinii_acc_order_lookup',orderLookup)}catch(_){}}
 lastOrder={...result.order,clockOffset:Number(result.order.servidorAgora||Date.now())-Date.now()};session.set('vinii_acc_last_order',lastOrder);pending=null;pendingSent=false;session.set('vinii_acc_pending',null);
 if(lastOrder.status==='Cancelado'){view='cart';render();message('Este pedido foi cancelado pela loja. Confira seu carrinho para fazer uma nova compra.');return}
 cart={};saveCart();draft={};view='success';render();load().catch(()=>{});
}
async function submitPending(){
 if(loading||!pending)return;loading=true;const payload=pending;renderRecovery();message(pendingSent?'Consultando a confirmação do seu pedido…':'Enviando pedido…');
 try{
   if(pendingSent){try{const previous=await recoverOrder(payload);if(previous){await finishConfirmedOrder(previous);return}}catch(_){}}
   pendingSent=true;
   try{const result=await request('createAccessoryOrder',payload);if(!result.ok||!result.order)throw Error('Resposta incompleta.');await finishConfirmedOrder(result);return}
   catch(error){if(error.definitive)throw error;}
   message('Pedido enviado. Conferindo a confirmação…');
   try{const previous=await recoverOrder(payload);if(previous){await finishConfirmedOrder(previous);return}}catch(_){}
   // Alternativa de transporte; o resultado só é aceito após consulta autenticada pelo hash.
   await sendOrderWithoutReading(payload);
   for(let attempt=0;attempt<2;attempt++){
     if(attempt)await new Promise(resolve=>setTimeout(resolve,1500));
     try{const previous=await recoverOrder(payload);if(previous){await finishConfirmedOrder(previous);return}}catch(_){}
   }
   throw Error('Ainda não foi possível confirmar a resposta. Você pode conferir novamente ou conversar com o atendente.');
 }catch(error){
   if(error.definitive&&!/registrado com outros dados/i.test(error.message)){pending=null;pendingSent=false;session.set('vinii_acc_pending',null);view='cart';render();message(error.message);load().then(()=>{if(view==='cart'){render();message(error.message)}}).catch(()=>{});}
   else{loading=false;renderRecovery();message(error.message||'Não foi possível confirmar a resposta. Converse com o atendente ou tente conferir novamente.');}
 }finally{loading=false;const button=$('acc-retry');if(button){button.disabled=false;button.textContent='Conferir e continuar'}}
}

function renderSuccess(){
 if(!lastOrder){view='catalog';renderCatalog();return}
 const o=lastOrder,a=o.endereco,address=`${a.rua}, ${a.numero}${a.complemento?' · '+a.complemento:''} — ${a.bairro}, ${a.cidade}/${a.uf}${a.cep?' · CEP '+a.cep:''}`,closed=reservationClosed(o),waiting=o.status==='Aguardando pagamento';
 const text=closed?reservationContactText(o):`Olá! Quero finalizar meu pedido de acessórios da Vinii Imports.\nPedido: ${o.id}\nNome: ${o.nome}\nWhatsApp: ${o.whatsapp}\n\n${o.items.map(i=>`${i.quantidade}× ${i.tipo} ${i.modelo} · ${i.nome} — ${money(i.preco*i.quantidade)}`).join('\n')}\n\nProdutos: ${money(o.subtotal)}\nFrete: ${money(o.frete)}\nTotal: ${money(o.total)}\nEntrega: ${address}${a.referencia?'\nReferência: '+a.referencia:''}\n\nGostaria de confirmar o pagamento e a entrega.`;
 content.innerHTML=`<div class="acc-message" id="acc-reservation-clock" role="status">${esc(reservationText(o))}</div><h3>${esc(o.nome)}, seu pedido continua registrado.</h3><p class="acc-muted" style="overflow-wrap:anywhere">Pedido ${esc(o.id)} · ${esc(o.status)}</p><div class="acc-columns"><div>${o.items.map(i=>`<p>${i.quantidade}× ${esc(i.tipo+' '+i.modelo+' · '+i.nome)} <b>${money(i.preco*i.quantidade)}</b></p>`).join('')}<p class="acc-muted">Entrega: ${esc(address)}${a.referencia?'<br>Referência: '+esc(a.referencia):''}</p><div class="acc-total-row"><span>Produtos</span><b>${money(o.subtotal)}</b></div><div class="acc-total-row"><span>Frete</span><b>${money(o.frete)}</b></div><div class="acc-total-row total"><span>Total do pedido</span><b>${money(o.total)}</b></div></div><aside class="acc-summary" id="acc-payment-box"><h3 style="margin-top:0" id="acc-payment-heading">${closed?'Converse com a loja':waiting?'Pagamento via Pix':'Pagamento confirmado'}</h3><div data-reservation-payment ${closed||!waiting?'hidden':''}><p class="acc-muted">Recebedor: ${esc(o.pixNome)}</p><div class="acc-key">${esc(o.pixChave)}</div><div class="acc-actions"><button class="acc-button secondary" id="acc-copy">Copiar chave Pix</button></div></div><a class="acc-button" id="acc-order-contact" href="https://wa.me/${String(o.lojaWhatsApp).replace(/\D/g,'')}?text=${encodeURIComponent(text)}" target="_blank" rel="noopener">Conversar com um atendente</a><p class="acc-muted" id="acc-payment-help"></p><button class="acc-button secondary" type="button" id="acc-refresh-order">Atualizar situação do pedido</button></aside></div><div class="acc-actions"><button class="acc-button secondary" data-view="catalog">Continuar comprando</button></div>`;
 $('acc-copy').onclick=async()=>{if(reservationClosed(lastOrder)||lastOrder.status!=='Aguardando pagamento'){refreshReservationDisplay();return}try{await navigator.clipboard.writeText(o.pixChave);message('Chave Pix copiada.')}catch(_){message('Selecione a chave Pix acima e copie.')}};
 $('acc-refresh-order').onclick=async()=>{await refreshLastOrder();refreshReservationDisplay()};refreshReservationDisplay();
}

async function open(){const cached=readCatalogCache();if(cached){data=cached;render()}else content.innerHTML='<p class="acc-muted">Carregando acessórios…</p>';try{await load();if(cached)refreshCatalogView();else render()}catch(e){if(cached){message('Não foi possível atualizar agora. Mostrando a última lista salva.');return}content.innerHTML='<div class="acc-empty">'+esc(e.message)+'</div><div class="acc-actions"><button class="acc-button" id="acc-load-retry">Tentar novamente</button></div>';$('acc-load-retry').onclick=open}}
let orderLookup=session.get('vinii_acc_order_lookup'),orderRefreshBusy=false;
function reservationTimeLeft(order){if(!order?.reservaAte)return null;return Math.max(0,Number(order.reservaAte)-(Date.now()+Number(order.clockOffset||0)))}
function reservationClosed(order){return order?.status==='Reserva expirada'||order?.status==='Cancelado'||(order?.status==='Aguardando pagamento'&&reservationTimeLeft(order)===0)}
function reservationText(order){
 if(order.status==='Reserva expirada')return 'Reserva encerrada. Seu pedido continua com a loja: se já pagou, envie o comprovante ao atendente para confirmar.';
 if(order.status==='Cancelado')return 'Pedido cancelado. Fale com a loja para continuar.';
 if(order.status!=='Aguardando pagamento')return 'Pagamento confirmado pela loja. Seu pedido está '+String(order.status).toLowerCase()+'.';
 const left=reservationTimeLeft(order);if(left===null)return 'Aguardando a confirmação do pagamento pela loja.';
 if(left<=0)return 'O prazo da reserva terminou. Se já pagou, fale com a loja para confirmar; o pedido continua registrado.';
 const minutes=Math.floor(left/60000),seconds=Math.floor(left%60000/1000);return 'Seus itens estão reservados por mais '+String(minutes).padStart(2,'0')+':'+String(seconds).padStart(2,'0')+'. A loja precisa confirmar o Pix para concluir a venda.';
}
function reservationContactText(order){
 return 'Olá! Preciso confirmar meu pedido '+order.id+' de acessórios.\nNome: '+order.nome+'\nSe já enviei o Pix, gostaria que conferissem o comprovante e o estoque para concluir a compra.';
}
function refreshReservationDisplay(){
 if(view!=='success'||!lastOrder||!$('acc-reservation-clock'))return;
 $('acc-reservation-clock').textContent=reservationText(lastOrder);
 const block=$('acc-payment-box'),help=$('acc-payment-help'),closed=reservationClosed(lastOrder),waiting=lastOrder.status==='Aguardando pagamento';
 if(block){block.querySelectorAll('[data-reservation-payment]').forEach(e=>e.hidden=closed||!waiting);const heading=$('acc-payment-heading');if(heading)heading.textContent=closed?'Converse com a loja':waiting?'Pagamento via Pix':'Pagamento confirmado';}
 if(help)help.textContent=closed?'A chave Pix foi ocultada porque a reserva terminou. Se já pagou, seu pedido ainda pode ser confirmado pelo atendente, mediante estoque.':waiting?'Envie o comprovante pelo WhatsApp. O pagamento será confirmado pela loja.':'A loja confirmou seu pagamento. Você pode acompanhar a entrega pelo atendimento.';
}
async function refreshLastOrder(){
 if(orderRefreshBusy||!orderLookup||!lastOrder||view!=='success')return;orderRefreshBusy=true;
 try{const result=await recoverOrderByProof(orderLookup);if(result?.order&&lastOrder.id===result.order.id){const oldStatus=lastOrder.status;lastOrder={...result.order,clockOffset:Number(result.order.servidorAgora||Date.now())-Date.now()};session.set('vinii_acc_last_order',lastOrder);if(view==='success'){if(oldStatus!==lastOrder.status){render();}else refreshReservationDisplay();}}}catch(_){}finally{orderRefreshBusy=false}
}
setInterval(()=>{if(typeof document.hidden!=='undefined'&&document.hidden)return;refreshReservationDisplay()},1000);
setInterval(()=>{if(typeof document.hidden!=='undefined'&&document.hidden)return;if(view==='success'&&['Aguardando pagamento','Reserva expirada'].includes(lastOrder?.status))refreshLastOrder();else if(!pending&&!loading&&['catalog','cart'].includes(view))load().then(refreshCatalogView).catch(()=>{})},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view==='success')refreshLastOrder()});

$('acc-photo-close').onclick=()=>$('acc-photo').close();open();
})();
</script>

<style>#acc-shop{display:block;width:min(1180px,100%);max-height:none;margin:0 auto;border:0;border-radius:0;box-shadow:none;overflow:visible;min-height:100dvh}.acc-wrap{min-height:70dvh}.acc-head{flex-wrap:wrap}.acc-head .acc-button{font-size:13px;padding:9px 12px}.acc-grid .acc-card{min-width:0}</style>
<style>
/* Visual alinhado ao catálogo principal Vinii Imports — sem alterar estoque e pedidos */
body{background:radial-gradient(ellipse 65% 460px at 50% -120px,rgba(201,162,39,.09),transparent),#0a0a0b!important;font-family:'Inter',sans-serif!important;color:#f5f4f0}
#acc-shop{--ag:#c9a227;--ab:transparent;--ap:#15171b;--al:rgba(255,255,255,.10);color:#f5f4f0;font-family:'Inter',sans-serif;max-width:1180px}
.acc-head{position:relative;top:auto;z-index:2;background:transparent;border-bottom:1px solid rgba(201,162,39,.2);padding:34px 26px 27px;align-items:center}
.acc-head small{font-size:10px;font-weight:700;color:#d7bb72;letter-spacing:.19em}
.acc-head h2{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(27px,4vw,42px);letter-spacing:-.045em;line-height:1.15;margin:9px 0}
.acc-head-dot{color:#c9a227}
.acc-head-desc{font-size:13px;color:#adb0b6;margin:7px 0 0;line-height:1.6}
.acc-wrap{padding:27px 26px 60px}
.acc-wrap>p.acc-muted:first-child{font-size:14px;color:#b9b9bc;margin:0 0 23px}
.acc-top{padding:15px;background:#15171b;border:1px solid rgba(255,255,255,.08);border-radius:14px;gap:11px;margin-bottom:24px}
.acc-input,#acc-checkout input,#acc-checkout select{background:#0f1115;border:1px solid rgba(255,255,255,.15);border-radius:9px;min-height:45px;color:#f5f4f0}
.acc-input:focus,#acc-checkout input:focus,#acc-checkout select:focus{outline:1px solid #c9a227;border-color:#c9a227}
.acc-button{background:linear-gradient(135deg,#efd176,#bb902e);color:#161208;border:1px solid #c9a227;border-radius:9px;font-weight:700;transition:transform .18s ease,filter .18s ease,background .18s ease}
.acc-button:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px)}

.acc-grid{gap:16px}
.acc-card{background:linear-gradient(145deg,#1a1c21,#13151a);border:1px solid rgba(255,255,255,.10);border-radius:14px;transition:border-color .2s,transform .2s,box-shadow .2s}
.acc-card:hover{border-color:rgba(201,162,39,.4);transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,0,0,.24)}
.acc-product-photo{background:linear-gradient(145deg,#202227,#0e1013);height:215px}
.acc-card h3,.acc-summary h3,.acc-wrap>h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-.025em}
.acc-tag{font-weight:700;font-size:10px;color:#d9bd74}
.acc-price{color:#f1d478;font-family:'Space Grotesk',sans-serif;font-size:23px}
.acc-muted{color:#afb1b8}
.acc-summary{background:linear-gradient(145deg,#1a1c21,#13151a);border-color:rgba(201,162,39,.18)}
.acc-empty{border-color:rgba(201,162,39,.28)}
#acc-live{background:#252016;border-color:rgba(201,162,39,.4);color:#f1d478}
@media(max-width:760px){.acc-head{padding:25px 16px 20px;gap:13px}.acc-head h2{font-size:29px}.acc-head-desc{font-size:12px}.acc-wrap{padding:19px 13px 48px}.acc-top{padding:11px;gap:9px}.acc-top input,.acc-top select{min-width:130px}.acc-card-body{padding:13px}.acc-product-photo{height:175px}.acc-grid{gap:11px}.acc-card h3{font-size:16px}.acc-price{font-size:20px}}
@media(max-width:430px){.acc-head{align-items:flex-start}.acc-back{font-size:11px!important}.acc-top .acc-button{width:100%}.acc-product-photo{height:145px}}
</style>
